# Every push and pull request: the library's checks (typecheck, lint, format, unit tests, build),
# and Storybook's build and its stories run as tests in Chromium (interactions and the a11y check). On main, the
# catalogue is published to GitHub Pages.
name: CI

on:
  push:
  pull_request:
  # Publish an existing release tag (the publish-tag job): when a release's publish failed after semantic-release
  # tagged it, a rerun releases nothing, so this builds that tag, publishes it to npm and makes its GitHub Release.
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish, e.g. v0.1.0"
        required: true
        type: string

# A newer push to a pull request cancels its older run; runs on branches each finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The pnpm command, at packageManager's version: package.json's scripts call `pnpm` themselves.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  storybook:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The pnpm command, at packageManager's version: package.json's scripts call `pnpm` themselves.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Chromium for the Playwright version the lockfile pins, with its system libraries.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build-storybook
      - run: pnpm test-storybook
      # On main, the built catalogue is kept as the Pages artifact the pages job deploys. The release needs this job,
      # so a failed upload must not fail it: the pages job then fails on the missing artifact, and the release goes on.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  # Publishes the catalogue built by the storybook job to GitHub Pages (https://mcurcio.github.io/patchbay/) on a push
  # to main, once check and storybook pass. It needs the repository's Pages source set to GitHub Actions
  # (CONTRIBUTING.md, Storybook on GitHub Pages). Nothing waits on it: the release job does not need it.
  pages:
    needs: [check, storybook]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write # deploy to Pages
      id-token: write # the deployment's OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # What a release would publish, on every push and pull request, with no secrets: the package built with a made-up
  # version stamped into a copy of package.json (.github/release-build.sh checks the tarball's name, version and
  # export targets), then `npm publish --dry-run` of that tarball. The release job below runs the same two scripts.
  release-dry-run:
    runs-on: ubuntu-24.04
    env:
      VERSION: 1.2.3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: bash .github/release-build.sh "$VERSION"
      # The build stamps a copy, never the tree: nothing tracked may change.
      - run: |
          changed=$(git status --porcelain --untracked-files=no)
          [ -z "$changed" ] || { echo "::error::release-build.sh changed tracked files:"; echo "$changed"; exit 1; }
      - run: bash .github/release-npm.sh "$VERSION" --dry-run

  # Merging to main is the release. semantic-release (.releaserc.json, its tooling pinned in .github/release/) reads
  # the Conventional Commits since the last v* tag: fix a patch, feat a minor, a breaking change a minor while the
  # version is 0.x (the rule to remove at 1.0), other types nothing. It appends the notes to CHANGELOG.md, commits only
  # that file as `chore(release): <version> [skip ci]` and pushes it to main, tags that commit v<version>, publishes
  # the package to npmjs.org (.github/release-npm.sh: trusted publishing, or the NPM_TOKEN secret if set, with
  # provenance) and makes the GitHub Release with the notes and the .tgz. The version is never committed to
  # package.json. Never cancelled: a release stopped halfway can leave a tag without its package.
  release:
    needs: [check, storybook, release-dry-run]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # the CHANGELOG.md commit, the tag and the GitHub Release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit and tag, to find the last release
      # With no v* tag semantic-release would release 1.0.0. The baseline tag v0.0.0 on the first commit makes the
      # first release 0.1.0 (a feat) or 0.0.1 (only fixes), counting every commit since. It is made once, here.
      - name: Baseline tag v0.0.0
        run: |
          if [ -n "$(git tag --list 'v*')" ]; then
            echo "A v* tag exists; no baseline needed."
            exit 0
          fi
          root=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          git tag v0.0.0 "$root"
          if git push origin v0.0.0; then
            echo "::notice title=Baseline tag::Tagged the first commit $root as v0.0.0"
          else
            echo "::error title=Baseline tag::Could not push v0.0.0. Push it once by hand: git tag v0.0.0 $root && git push origin v0.0.0"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix .github/release --no-audit --no-fund
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }} # optional: trusted publishing needs no token (CONTRIBUTING.md, Releases)
        run: .github/release/node_modules/.bin/semantic-release

  # Run by hand (Actions, CI, Run workflow, with a tag): publishes a release tag that semantic-release made but did not
  # publish (CONTRIBUTING.md, "When a publish fails after the tag"). It builds the tag's tree as the release job would,
  # publishes the package unless npm already has that version, and makes the GitHub Release from the tag's section of
  # CHANGELOG.md unless it exists. Safe to run again. Lives in ci.yml so the trusted publisher named for ci.yml covers it.
  publish-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # the GitHub Release
      id-token: write # npm trusted publishing and provenance
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag's form
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a release tag like v1.2.3"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: bash .github/release-build.sh "$VERSION"
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }} # optional: trusted publishing needs no token
        run: |
          if [ "$(npm view "@mcurcio/patchbay@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::npm already has @mcurcio/patchbay@$VERSION; not publishing."
          else
            bash .github/release-npm.sh "$VERSION"
          fi
      - name: Make the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::The GitHub Release $TAG exists; leaving it."
            exit 0
          fi
          # The tag's section of CHANGELOG.md: from its "## [x.y.z]" heading to the next release's heading.
          awk -v v="$VERSION" '
            /^##? \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::No section for $VERSION in CHANGELOG.md"; exit 1; }
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            "./pack/mcurcio-patchbay-$VERSION.tgz#npm package ($TAG)"
